<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Preços</title>
<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --text: #18212f; --muted: #5d6b7e; --line: #e2e7ee;
  --accent: #1d5fd6; --accent-text: #ffffff; --danger: #b42318;
  --ok: #05603a; --ok-bg: #d9f5e5; --err: #912018; --err-bg: #fde4e1;
  --warn: #7a2e0e; --warn-bg: #fdf0c8; --input: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e131a; --card: #171e28; --text: #e7ebf1; --muted: #9aa7b8; --line: #2a3442;
    --accent: #6a9bf4; --accent-text: #08111f; --danger: #f97066;
    --ok: #75e0a7; --ok-bg: #0f2e20; --err: #fda29b; --err-bg: #3a1411;
    --warn: #fec84b; --warn-bg: #3a2a06; --input: #0e131a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
h2 { font-size: 1.05rem; margin: 0 0 12px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.grid .card { margin-bottom: 0; }
label { display: block; font-size: .85rem; color: var(--muted); margin: 10px 0 4px; }
input[type=text], input[type=url], input[type=search] {
  width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--input); color: var(--text); font: inherit;
}
input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button, .btn {
  display: inline-block; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
}
button.secondary, .btn.secondary { background: transparent; color: var(--accent); }
button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
button.small { padding: 5px 10px; font-size: .85rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row > input { flex: 1 1 220px; width: auto; }
.check { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; color: var(--text); font-size: .9rem; }
.muted { color: var(--muted); font-size: .88rem; }
.flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; }
.flash.ok { background: var(--ok-bg); color: var(--ok); }
.flash.err { background: var(--err-bg); color: var(--err); }
.warn { background: var(--warn-bg); color: var(--warn); padding: 10px 14px; border-radius: 8px; margin: 12px 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
td.num, th.num { text-align: right; white-space: nowrap; }
a { color: var(--accent); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--line); color: var(--muted); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.inactive td { opacity: .55; }
form.inline { display: inline; margin: 0; }
.target-form { display: inline-flex; gap: 4px; }
.target-form input { width: 110px; padding: 5px 8px; }
.target-form select { padding: 5px 8px; max-width: 170px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--input); color: var(--text); font: inherit; max-width: 100%; }
.group-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 8px; }
.err-note { color: var(--err); font-size: .8rem; max-width: 240px; margin-left: auto; white-space: normal; text-align: right; }
details.move { display: inline-block; position: relative; }
details.move > summary { list-style: none; cursor: pointer; padding: 5px 10px; font-size: .85rem; font-weight: 600; border: 1px solid var(--accent); color: var(--accent); border-radius: 8px; }
details.move > summary::-webkit-details-marker { display: none; }
details.move[open] > form { position: absolute; z-index: 2; right: 0; margin-top: 4px; padding: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
.card[id] { scroll-margin-top: 12px; }
@media (max-width: 640px) {
  .hide-narrow { display: none; }
  th, td { padding: 8px 4px; }
  td .actions { flex-direction: column; align-items: stretch; }
  td .actions button, td .actions summary { width: 100%; text-align: center; }
  .err-note { max-width: 110px; }
  td.num { white-space: normal; }
}
</style>
</head>
<body>
<main>
  <h1><a href="/" style="color:inherit;text-decoration:none">Monitor de Preços</a></h1>
  {% block content %}{% endblock %}
</main>
</body>
</html>
